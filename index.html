<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barry's Game Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .game {
      background: #1f2937;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 400px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
    }
    button:hover {
      background: #2563eb;
    }
    .cookie {
      width: 120px;
      height: 120px;
      background: #d4a373;
      border-radius: 50%;
      margin: 10px auto;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <h1>Barry's Game Arcade</h1>
  <p>Click, play, and have fun!</p>

  <!-- Cookie Clicker Mini -->
  <div class="game">
    <h2>Cookie Clicker Mini</h2>
    <div class="cookie" id="cookie"></div>
    <p>Cookies: <span id="cookieCount">0</span></p>
    <button onclick="resetCookie()">Reset</button>
  </div>

  <!-- Click Speed Test -->
  <div class="game">
    <h2>Click Speed Test</h2>
    <button id="startSpeed">Start</button>
    <button id="clickSpeed" disabled>Click!</button>
    <p>Clicks: <span id="speedCount">0</span></p>
    <p>Time left: <span id="speedTime">0</span>s</p>
  </div>

  <!-- Number Guess -->
  <div class="game">
    <h2>Number Guess</h2>
    <input type="number" id="guessInput" min="1" max="50" />
    <button id="submitGuess">Guess</button>
    <p id="guessMessage"></p>
  </div>

<script>
  // Cookie Clicker
  let cookieCount = 0;
  document.getElementById("cookie").onclick = () => {
    cookieCount++;
    document.getElementById("cookieCount").innerText = cookieCount;
  };
  function resetCookie() {
    cookieCount = 0;
    document.getElementById("cookieCount").innerText = cookieCount;
  }

  // Click Speed Test
  let speedCount = 0;
  let timeLeft = 0;
  let timer;
  document.getElementById("startSpeed").onclick = () => {
    speedCount = 0;
    timeLeft = 5;
    document.getElementById("speedCount").innerText = speedCount;
    document.getElementById("speedTime").innerText = timeLeft;
    document.getElementById("clickSpeed").disabled = false;
    document.getElementById("startSpeed").disabled = true;

    timer = setInterval(() => {
      timeLeft--;
      document.getElementById("speedTime").innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        document.getElementById("clickSpeed").disabled = true;
        document.getElementById("startSpeed").disabled = false;
      }
    }, 1000);
  };
  document.getElementById("clickSpeed").onclick = () => {
    if (timeLeft > 0) {
      speedCount++;
      document.getElementById("speedCount").innerText = speedCount;
    }
  };

  // Number Guess
  let secret = Math.floor(Math.random() * 50) + 1;
  document.getElementById("submitGuess").onclick = () => {
    const guess = Number(document.getElementById("guessInput").value);
    if (!guess || guess < 1 || guess > 50) {
      document.getElementById("guessMessage").innerText = "Enter a number between 1 and 50.";
      return;
    }
    if (guess === secret) {
      document.getElementById("guessMessage").innerText = "Correct! New number generated.";
      secret = Math.floor(Math.random() * 50) + 1;
    } else if (guess < secret) {
      document.getElementById("guessMessage").innerText = "Too low!";
    } else {
      document.getElementById("guessMessage").innerText = "Too high!";
    }
  };
</script>

</body>
</html>
